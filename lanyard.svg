<svg width="330" height="480" viewBox="0 0 330 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1723"/>
      <stop offset="100%" stop-color="#0e2033"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="165" cy="185" r="46"/>
    </clipPath>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- swinging group: strap + card rotate together around the hook point -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="4 165 8; -4 165 8; 4 165 8" dur="4s" repeatCount="indefinite" additive="sum"/>

    <!-- hook -->
    <circle cx="165" cy="10" r="7" fill="none" stroke="#38bdf8" stroke-width="3"/>

    <!-- strap -->
    <path d="M155,14 L120,120 L210,120 L175,14 Z" fill="url(#strapGrad)" opacity="0.9"/>
    <text x="165" y="75" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#052030" font-weight="700" transform="rotate(90 165 75)">DEV</text>

    <!-- clip -->
    <rect x="150" y="112" width="30" height="16" rx="3" fill="#0f2937" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="165" cy="120" r="3" fill="#22d3ee"/>

    <!-- card body -->
    <g filter="url(#cardShadow)">
      <rect x="35" y="128" width="260" height="330" rx="18" fill="url(#cardGrad)" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.5"/>

      <!-- header strip -->
      <rect x="35" y="128" width="260" height="46" rx="18" fill="url(#headerGrad)"/>
      <rect x="35" y="156" width="260" height="18" fill="url(#headerGrad)"/>
      <text x="165" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#e0f2fe" letter-spacing="2">ACCESS • GRANTED</text>

      <!-- avatar ring -->
      <circle cx="165" cy="185" r="50" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>
      <circle cx="165" cy="185" r="46" fill="#0f2937"/>
      <text x="165" y="200" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#22d3ee" clip-path="url(#avatarClip)">FK</text>

      <!-- name -->
      <text x="165" y="262" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#e2f4ff">Faizan Khan</text>
      <text x="165" y="284" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#38bdf8">Full Stack · AI/ML Engineer</text>

      <!-- divider -->
      <line x1="60" y1="300" x2="270" y2="300" stroke="#22d3ee" stroke-opacity="0.25"/>

      <!-- info rows -->
      <text x="60" y="326" font-family="Consolas, monospace" font-size="12" fill="#7dd3fc">LOCATION</text>
      <text x="270" y="326" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#e2f4ff">Pune, India</text>

      <text x="60" y="350" font-family="Consolas, monospace" font-size="12" fill="#7dd3fc">STACK</text>
      <text x="270" y="350" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#e2f4ff">MERN + AI</text>

      <text x="60" y="374" font-family="Consolas, monospace" font-size="12" fill="#7dd3fc">STATUS</text>
      <text x="270" y="374" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#4ade80">● Building</text>

      <!-- barcode footer -->
      <g transform="translate(60,392)" fill="#22d3ee" opacity="0.8">
        <rect x="0" y="0" width="2" height="30"/>
        <rect x="5" y="0" width="1" height="30"/>
        <rect x="9" y="0" width="3" height="30"/>
        <rect x="15" y="0" width="1" height="30"/>
        <rect x="19" y="0" width="2" height="30"/>
        <rect x="24" y="0" width="1" height="30"/>
        <rect x="28" y="0" width="4" height="30"/>
        <rect x="35" y="0" width="1" height="30"/>
        <rect x="39" y="0" width="2" height="30"/>
        <rect x="44" y="0" width="1" height="30"/>
        <rect x="48" y="0" width="3" height="30"/>
        <rect x="54" y="0" width="1" height="30"/>
        <rect x="58" y="0" width="2" height="30"/>
        <rect x="63" y="0" width="1" height="30"/>
        <rect x="67" y="0" width="4" height="30"/>
        <rect x="74" y="0" width="1" height="30"/>
        <rect x="78" y="0" width="2" height="30"/>
        <rect x="83" y="0" width="1" height="30"/>
        <rect x="87" y="0" width="3" height="30"/>
        <rect x="93" y="0" width="2" height="30"/>
        <rect x="98" y="0" width="1" height="30"/>
        <rect x="102" y="0" width="4" height="30"/>
        <rect x="109" y="0" width="1" height="30"/>
        <rect x="113" y="0" width="2" height="30"/>
        <rect x="118" y="0" width="1" height="30"/>
        <rect x="122" y="0" width="3" height="30"/>
        <rect x="128" y="0" width="1" height="30"/>
        <rect x="132" y="0" width="2" height="30"/>
        <rect x="137" y="0" width="1" height="30"/>
        <rect x="141" y="0" width="4" height="30"/>
        <rect x="148" y="0" width="1" height="30"/>
        <rect x="152" y="0" width="2" height="30"/>
        <rect x="157" y="0" width="1" height="30"/>
        <rect x="161" y="0" width="3" height="30"/>
        <rect x="167" y="0" width="1" height="30"/>
        <rect x="171" y="0" width="2" height="30"/>
        <rect x="176" y="0" width="1" height="30"/>
        <rect x="180" y="0" width="4" height="30"/>
        <rect x="187" y="0" width="1" height="30"/>
        <rect x="191" y="0" width="2" height="30"/>
        <rect x="196" y="0" width="1" height="30"/>
        <rect x="200" y="0" width="4" height="30"/>
      </g>
    </g>
  </g>
</svg>
