<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#071522"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" fill="url(#bgGrad)"/>
  <rect width="1000" height="260" fill="url(#glow)"/>

  <!-- circuit grid lines -->
  <g stroke="#22d3ee" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="40" x2="1000" y2="40"/>
    <line x1="0" y1="220" x2="1000" y2="220"/>
    <line x1="120" y1="0" x2="120" y2="260"/>
    <line x1="880" y1="0" x2="880" y2="260"/>
  </g>

  <!-- animated scan line -->
  <rect x="0" y="0" width="4" height="260" fill="#22d3ee" opacity="0.6">
    <animate attributeName="x" values="0;996;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.8">
    <path d="M30,30 L30,60 M30,30 L60,30"/>
    <path d="M970,30 L970,60 M970,30 L940,30"/>
    <path d="M30,230 L30,200 M30,230 L60,230"/>
    <path d="M970,230 L970,200 M970,230 L940,230"/>
  </g>

  <text x="500" y="110" text-anchor="middle" font-family="'Segoe UI', Consolas, monospace" font-size="46" font-weight="700" fill="url(#textGrad)" filter="url(#softGlow)">
    Faizan Khan
  </text>

  <text x="500" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#7dd3fc" opacity="0.9">
    <tspan>&gt; Full Stack Developer_</tspan>
  </text>

  <!-- typewriter caret -->
  <rect x="640" y="136" width="12" height="20" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="500" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" fill="#94a3b8">
    MERN Stack  •  AI/ML Engineering  •  RAG &amp; LangGraph Systems
  </text>

  <!-- pulse dots -->
  <g>
    <circle cx="380" cy="190" r="3" fill="#22d3ee">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="190" r="3" fill="#22d3ee">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
